<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insulin Companion</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 12px;
         background: #14161a; color: #e8e8e8; }
  h1 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
         flex-wrap: wrap; }
  input { font: inherit; padding: 7px 8px; border-radius: 6px;
          border: 1px solid #333; background: #14161a; color: inherit; width: 5em; }
  .pill { background: #1e2128; border-radius: 999px; padding: 5px 11px;
          font-variant-numeric: tabular-nums; color: #b6bec9; }
  #reload { font: inherit; border: 0; cursor: pointer; }
  #wrap { position: relative; width: 100%; max-width: 720px;
          aspect-ratio: 2 / 3; background: #0e1013; border-radius: 10px;
          overflow: hidden; touch-action: manipulation; }
  #tiles { display: grid; grid-template-columns: 1fr 1fr;
           grid-template-rows: 1fr 1fr 1fr; width: 100%; height: 100%; }
  #tiles img { width: 100%; height: 100%; display: block; }
  #me { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px;
        pointer-events: none; transition: left .15s linear, top .15s linear; }
  #me svg { display: block; }
  #ping { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
          border: 2px solid #ffd24a; border-radius: 50%; opacity: 0;
          pointer-events: none; }
  #ping.on { animation: pop .6s ease-out; }
  @keyframes pop { from { opacity: 1; transform: scale(.3); }
                   to   { opacity: 0; transform: scale(1.6); } }
</style>

<h1>Insulin Companion</h1>
<div class="bar">
  <label>PIN <input id="pin" maxlength="4" inputmode="numeric"></label>
  <span class="pill" id="pos">-</span>
  <span class="pill" id="status">waiting</span>
  <button type="button" id="reload" class="pill" hidden>reload tiles</button>
</div>

<div id="wrap">
  <div id="tiles"></div>
  <div id="me" hidden>
    <svg width="16" height="16" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="7" fill="#4aa3ff" stroke="#0b0d10" stroke-width="2"/>
      <path d="M8 1.5 L11 7 H5 Z" fill="#eaf4ff"/>
    </svg>
  </div>
  <div id="ping"></div>
</div>

<script>
// Projection straight out of x64a.rpf\data\tune\minimap.ymt, <Bitmap> block:
//   iBitmapTilesX 2, iBitmapTilesY 3, vBitmapTileSize 4500x4500,
//   vBitmapStart (-4140, 8400), Y decreasing downward.
// Do NOT use the <Tiles> block in the same file - those numbers describe the
// vector minimap, not this bitmap, and every marker would land slightly off.
const COLS = 2, ROWS = 3, TILE = 4500;
const WORLD = {
  x0: -4140, y0: 8400,
  w:  COLS * TILE,          //  9000
  h:  ROWS * TILE           // 13500
};

const $ = id => document.getElementById(id);
const pin = $('pin');
pin.value = new URLSearchParams(location.search).get('pin')
         || localStorage.getItem('pin') || '';

// Lay the tiles out, one request at a time. Row 0 is north, column 0 is
// west. The PIN rides in the query string because an <img> request cannot
// set a header - which is exactly why pin_ok() in src/net/conn.cpp accepts
// both forms.
//
// Sequential, not six parallel fetches: write_response() in src/net/http.cpp
// sends no Cache-Control/ETag/Last-Modified, the server closes the
// connection after every response, and it listens with a backlog of 2
// (sceNetListen(g_listen, 2)) - one request at a time is what it can
// actually take. Chaining each <img>'s src off the previous one's onload
// costs a fraction of a second on a LAN and doesn't fight the server for
// its one or two connection slots.
//
// A generation counter is captured in the closure of each load chain. If
// loadTiles() runs again (a corrected PIN, a manual reload) while an older
// chain still has a request in flight, that chain's onload/onerror checks
// its captured gen against the current tileGen and, if it no longer
// matches, does nothing - it can't retry, advance, or reveal the reload
// button on behalf of a generation nobody is looking at any more.
//
// Each tile gets up to MAX_TILE_RETRIES independent retries, done by
// re-assigning its own .src to the same URL - with no cache headers to
// short-circuit it, that reflecting the src attribute is a genuine re-fetch,
// not a no-op. Only that one tile is retried, never all six, so a single
// flaky tile can't turn into a six-image storm every time something else
// happens to succeed (that was the bug: rebuilding the whole grid on every
// successful /api/state poll while the server was merely congested rather
// than down). Once a tile's retries are exhausted the chain moves on to the
// rest, and the #reload button appears as the way to try again by hand.
const MAX_TILE_RETRIES = 3;
let tileGen = 0;
const tiles = $('tiles');
const reloadBtn = $('reload');

function loadTiles() {
  const gen = ++tileGen;
  reloadBtn.hidden = true;
  tiles.innerHTML = '';

  const total = ROWS * COLS;
  const imgs = [];
  for (let i = 0; i < total; i++) {
    const img = document.createElement('img');
    img.alt = '';
    tiles.appendChild(img);
    imgs.push(img);
  }

  function loadOne(i) {
    if (i >= total) return;
    const img = imgs[i];
    const r = Math.floor(i / COLS), c = i % COLS;
    const url = `/map/tile_${r}_${c}.png?pin=${encodeURIComponent(pin.value)}`;
    let retries = 0;

    img.onload = () => { if (gen === tileGen) loadOne(i + 1); };
    img.onerror = () => {
      if (gen !== tileGen) return;        // a discarded generation - ignore
      if (++retries <= MAX_TILE_RETRIES) {
        img.src = url;                    // re-fetch: nothing caches this response
      } else {
        reloadBtn.hidden = false;         // gave up on this one; offer a manual retry
        loadOne(i + 1);                   // don't let it block the rest of the chain
      }
    };
    img.src = url;
  }
  loadOne(0);
}

reloadBtn.addEventListener('click', loadTiles);

// 'input' rather than 'change' (which on mobile fires only on blur), so the
// map recovers the instant a correct 4th digit lands instead of waiting for
// the user to dismiss the keyboard. The length check keeps this from
// spamming near-certain 401s for every incomplete prefix while the PIN is
// still being typed - maxlength="4" means the value can only ever reach
// length 4 by way of a complete, four-digit PIN (typed or pasted).
pin.addEventListener('input', () => {
  if (pin.value.length !== 4) return;
  localStorage.setItem('pin', pin.value);
  loadTiles();
});
loadTiles();

const worldToFrac = (x, y) => ({
  u: (x - WORLD.x0) / WORLD.w,
  v: (WORLD.y0 - y) / WORLD.h
});
const fracToWorld = (u, v) => ({
  x: WORLD.x0 + u * WORLD.w,
  y: WORLD.y0 - v * WORLD.h
});

const headers = () => ({ 'X-Insulin-Pin': pin.value });

async function poll() {
  try {
    const r = await fetch('/api/state', { headers: headers() });
    if (r.status === 401) { $('status').textContent = 'wrong PIN'; return; }
    if (!r.ok)            { $('status').textContent = 'no state yet'; return; }
    const j = await r.json();

    const f = worldToFrac(j.x, j.y);
    const me = $('me');
    if (f.u < 0 || f.u > 1 || f.v < 0 || f.v > 1) {
      // Off the bitmap: interiors and the far ocean sit outside it.
      me.hidden = true;
      $('status').textContent = 'off map';
    } else {
      me.hidden = false;
      me.style.left = (f.u * 100) + '%';
      me.style.top  = (f.v * 100) + '%';
      // The heading is degrees clockwise from north, which is what CSS
      // rotate() means too, so it goes straight in.
      me.style.transform = `rotate(${j.heading}deg)`;
      $('status').textContent = 'connected';
    }
    $('pos').textContent =
      `${j.x.toFixed(0)}, ${j.y.toFixed(0)}, ${j.z.toFixed(0)}  ${j.heading.toFixed(0)}°`;
  } catch (e) {
    $('status').textContent = 'offline';
  }
}

// A teleport can't be undone and the whole map is one tap target, so a click
// that ends far from where the pointer went down - a scroll, a drag, a wipe
// across the screen - must not fire one. 10 CSS px is enough slack for a
// finger to wobble during a genuine tap (typical touch tap tolerances run
// 8-10px) while still catching any real drag, since the map is up to 720px
// across.
//
// Each click consumes the pointerdown it belongs to - downX/downY reset to
// null at the end, whether the click was accepted or not - so a stale
// coordinate from an earlier, unrelated gesture can never validate a later
// one. A click with no pointerdown on record at all (downX still null) is
// deliberately BLOCKED, not let through: on real mouse/touch input a
// pointerdown always precedes its click, so this branch only fires for
// something outside that model (a synthetic click, an assistive tool), and
// since a teleport can't be undone, an ambiguous case should fail closed,
// not open.
const TAP_SLOP = 10;
let downX = null, downY = null;
$('wrap').addEventListener('pointerdown', ev => {
  downX = ev.clientX;
  downY = ev.clientY;
});
$('wrap').addEventListener('pointercancel', () => {
  downX = downY = null;
});

$('wrap').addEventListener('click', async ev => {
  const isTap = downX !== null &&
    Math.hypot(ev.clientX - downX, ev.clientY - downY) <= TAP_SLOP;
  downX = downY = null;             // this click has consumed its pointerdown either way
  if (!isTap) return;                // no matching pointerdown, or it moved too far

  const box = ev.currentTarget.getBoundingClientRect();
  const u = (ev.clientX - box.left) / box.width;
  const v = (ev.clientY - box.top)  / box.height;
  const w = fracToWorld(u, v);

  const ping = $('ping');
  ping.style.left = (u * 100) + '%';
  ping.style.top  = (v * 100) + '%';
  ping.classList.remove('on');
  void ping.offsetWidth;            // restart the animation
  ping.classList.add('on');

  $('status').textContent = 'teleporting…';
  try {
    const r = await fetch('/api/teleport', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ x: w.x, y: w.y, ground: true })
    });
    $('status').textContent = r.ok ? 'sent' : ('refused ' + r.status);
  } catch (e) {
    $('status').textContent = 'offline';
  }
});

setInterval(poll, 500);
poll();
</script>
